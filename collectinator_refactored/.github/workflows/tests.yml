  toc-validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate TOC file
      run: |
        # Basic TOC validation
        if [ ! -f "Collectinator/Collectinator.toc" ]; then
          echo "Error: Collectinator.toc not found"
          exit 1
        fi
        
        # Check for required fields
        grep -q "## Title:" Collectinator/Collectinator.toc || (echo "Missing Title field" && exit 1)
        grep -q "## Interface:" Collectinator/Collectinator.toc || (echo "Missing Interface field" && exit 1)
        
        # Check interface version is correct for Wrath
        if ! grep -q "## Interface: 30300" Collectinator/Collectinator.toc; then
          echo "Warning: Interface version should be 30300 for Wrath of the Lich King"
        fi
        
        echo "TOC validation passed!"
      working-directory: ./collectinator_refactored

  lua-syntax:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Lua
      uses: leafo/gh-actions-lua@v8
      with:
        luaVersion: "5.1"
    
    - name: Syntax check all Lua files
      run: |
        echo "Checking Lua syntax..."
        errors=0
        for file in Collectinator/*.lua Collectinator/Database/*.lua Collectinator/Locales/*.lua; do
          if [ -f "$file" ]; then
            if ! luac -p "$file" 2>/dev/null; then
              echo "Syntax error in $file"
              errors=$((errors + 1))
            else
              echo "✓ $file"
            fi
          fi
        done
        
        if [ $errors -gt 0 ]; then
          echo "Found $errors files with syntax errors"
          exit 1
        fi
        
        echo "All Lua files have valid syntax!"
      working-directory: ./collectinator_refactored
