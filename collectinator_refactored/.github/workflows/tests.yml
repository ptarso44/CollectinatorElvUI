name: Lua Lint and TOC Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install Lua
      uses: leafo/gh-actions-lua@v8
      with:
        luaVersion: "5.1"
    
    - name: Install Luacheck
      run: luarocks install luacheck
    
